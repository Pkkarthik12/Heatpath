[package]
name = "heatpath"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
description = "Watch your filesystem and render a terminal heatmap of where you work."
repository = "https://github.com/Pkkarthik12/Heatpath"

[dependencies]
anyhow = "=1.0.86"
chrono = { version = "=0.4.38", features = ["serde"] }
clap = { version = "=4.5.4", features = ["derive"] }
crossterm = "=0.27.0"
csv = "=1.3.0"
dirs = "=5.0.1"
globset = "=0.4.14"
ignore = "=0.4.22"
notify = "=6.1.1"
ratatui = "=0.26.3"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
toml = "=0.8.12"

[dev-dependencies]
tempfile = "=3.10.1"
