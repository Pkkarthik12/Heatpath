[package]
name = "heatpath"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
description = "Watch your filesystem and render a terminal heatmap of where you work."
repository = "https://github.com/Pkkarthik12/Heatpath"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.27"
csv = "1.3"
dirs = "5.0"
globset = "0.4"
ignore = "0.4"
notify = "6.1"
ratatui = "0.26"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"
